name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firebase_rules.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Firebase Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only database
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
