<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Square</title>
    <link rel="stylesheet" href="style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK: 인증 전용 (2차에서 D1으로 전환 예정) -->
    <!-- Firebase SDK: 채팅/실시간 기능 임시 유지 (2차에서 D1으로 전환 예정) -->
    <!-- 중앙 서버 모듈 (D1 API 모드) -->
    <script src="../bsq_server.js?v=20260320-v2"></script>
</head>

<body>
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입합니다 -->

    <main class="main-content">
        <section class="hero-section">
            <div class="hero-inner">
                <article class="main-ad-banner">
                    <div class="ad-content">
                        <h2>광고</h2>
                    </div>
                </article>
                <nav class="category-grid">
                    <ul>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.5 1.5"></path><path d="M7.5 3.5L12 8"></path></svg></span>디자인</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg></span>생산성</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M6.7 6.7l10.6 10.6"></path><path d="M6.7 17.3l10.6-10.6"></path></svg></span>스포츠</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span>디지털 드로잉</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54z"></path></svg></span>성공 마인드</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>음악</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg></span>베이킹</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>사진</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg></span>영상</a></li>
                        <li><a href="#"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></span>공예</a></li>
                    </ul>
                </nav>
            </div>
        </section>

        <section class="class-lists-section">
            <div class="section-inner">
                <!-- 큐레이션 검정색 컨테이너 -->
                <div class="curated-sections-dark">
                    <article class="class-group popular-classes">
                        <h3 class="group-title">지금 인기 있는</h3>
                        <div class="card-grid" id="popularClassGrid">
                            <!-- JS에서 5개씩 2줄(최대 10개) 정도 렌더링 -->
                            <p class="empty-state">인기 클래스를 불러오는 중...</p>
                        </div>
                    </article>

                    <article class="class-group recommended-classes">
                        <h3 class="group-title">추천 클래스</h3>
                        <div class="recommend-columns">
                            <!-- 경제/제테크 컬럼 -->
                            <div class="recommend-column">
                                <div class="column-header">
                                    <div class="header-text">
                                        <h4>경제 | 제테크</h4>
                                        <p class="desc">부의 추월차선을 위한 로드맵</p>
                                    </div>
                                    <a href="../class/class_list.html" class="btn-more-arrow">➜</a>
                                </div>
                                <div class="mini-card-list" id="recommendGrid-1">
                                    <!-- JS에서 미니 카드 형태로 3-4개 렌더링 -->
                                </div>
                            </div>

                            <!-- 라이프 스타일 컬럼 -->
                            <div class="recommend-column">
                                <div class="column-header">
                                    <div class="header-text">
                                        <h4>라이프 스타일</h4>
                                        <p class="desc">일상에 활기를 불어넣는 시간</p>
                                    </div>
                                    <a href="../class/class_list.html" class="btn-more-arrow">➜</a>
                                </div>
                                <div class="mini-card-list" id="recommendGrid-2">
                                    <!-- JS에서 미니 카드 형태로 3-4개 렌더링 -->
                                </div>
                            </div>

                            <!-- 어도비 컬렉션 컬럼 -->
                            <div class="recommend-column">
                                <div class="column-header">
                                    <div class="header-text">
                                        <h4>어도비 컬렉션</h4>
                                        <p class="desc">전문적인 크리에이티브의 시작</p>
                                    </div>
                                    <a href="../class/class_list.html" class="btn-more-arrow">➜</a>
                                </div>
                                <div class="mini-card-list" id="recommendGrid-3">
                                    <!-- JS에서 미니 카드 형태로 3-4개 렌더링 -->
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- 그 외 전체 클래스 목록 -->
                <article class="class-group all-classes">
                    <h3 class="group-title">전체 클래스 살펴보기</h3>
                    <div class="card-grid large-grid" id="allClassGrid">
                        <!-- JS에서 나머지 모든 클래스 렌더링 -->
                    </div>
                </article>
            </div>
        </section>

        <section class="bottom-banner-section">
            <div class="banner-inner">
                <button class="btn-prev">⬅️</button>
                <div class="banner-content">
                    <p>배너</p>
                </div>
                <button class="btn-next">➡️</button>
            </div>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="main.js"></script>
    <script src="../dev_mode.js"></script>
</body>

</html>
