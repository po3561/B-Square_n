<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Square</title>
    <link rel="stylesheet" href="style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="../bsq_server.js"></script>
</head>

<body>
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입합니다 -->

    <main class="main-content">
        <section class="hero-section">
            <div class="hero-inner">
                <article class="main-ad-banner">
                    <div class="ad-content">
                        <h2>광고</h2>
                    </div>
                </article>
                <nav class="category-grid">
                    <ul>
                        <li><a href="#"><span class="icon">💻</span>디자인</a></li>
                        <li><a href="#"><span class="icon">📈</span>생산성</a></li>
                        <li><a href="#"><span class="icon">⚽</span>스포츠</a></li>
                        <li><a href="#"><span class="icon">🎨</span>디지털 드로잉</a></li>
                        <li><a href="#"><span class="icon">💡</span>성공 마인드</a></li>
                        <li><a href="#"><span class="icon">🎵</span>음악</a></li>
                        <li><a href="#"><span class="icon">🥐</span>베이킹</a></li>
                        <li><a href="#"><span class="icon">📸</span>사진</a></li>
                        <li><a href="#"><span class="icon">🎬</span>영상</a></li>
                        <li><a href="#"><span class="icon">🧶</span>공예</a></li>
                    </ul>
                </nav>
            </div>
        </section>

        <section class="class-lists-section">
            <div class="section-inner">
                <article class="class-group popular-classes">
                    <h3 class="group-title">지금 인기 있는</h3>
                    <div class="card-grid">
                        <div class="class-card">
                            <div class="card-thumbnail placeholder-orange"></div>
                            <div class="card-info">
                                <span class="category">경제/재테크</span>
                                <h4 class="title">클래스명 입력</h4>
                                <div class="stats">
                                    <span class="likes">❤️ 120</span><span class="rating">⭐ 4.5</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>

                <article class="class-group recommended-classes">
                    <h3 class="group-title">추천 클래스</h3>
                    <div class="recommend-columns">
                        <div class="column">
                            <div class="column-header">
                                <h4>경제 | 재테크</h4><a href="#" class="btn-more">➡️</a>
                            </div>
                            <ul class="column-list">
                                <li class="list-item">
                                    <div class="item-thumbnail placeholder-orange"></div>
                                    <div class="item-info">
                                        <p class="title">클래스명</p>
                                        <p class="rating">⭐ 4.5</p>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <div class="column">
                            <div class="column-header">
                                <h4>라이프 스타일</h4><a href="#" class="btn-more">➡️</a>
                            </div>
                        </div>
                        <div class="column">
                            <div class="column-header">
                                <h4>어도비 컬렉션</h4><a href="#" class="btn-more">➡️</a>
                            </div>
                        </div>
                    </div>
                </article>

                <article class="class-group all-classes">
                    <div class="card-grid large-grid"></div>
                </article>
            </div>
        </section>

        <section class="bottom-banner-section">
            <div class="banner-inner">
                <button class="btn-prev">⬅️</button>
                <div class="banner-content">
                    <p>배너</p>
                </div>
                <button class="btn-next">➡️</button>
            </div>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="main.js"></script>
    <script src="../dev_mode.js"></script>
</body>

</html>
