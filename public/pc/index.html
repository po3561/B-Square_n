<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Square</title>
    <style>
        body { background: #111; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loading { font-size: 1.2rem; color: #6e8efb; }
    </style>
</head>
<body>
    <div class="loading">잠시만 기다려주세요...</div>
    <script>
        // B-Square Mobile Integration: User-Agent based redirection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const path = window.location.pathname;

        if (isMobile) {
            // Redirect to Mobile Next.js App at root
            window.location.href = '/';
        } else {
            // Desktop: Ensure we land in the correct subfolder using absolute path
            if (path.includes('/bsnnnnnnnnnnnnnnnnnn/')) {
                // Already in subfolder, do nothing
            } else {
                window.location.href = '/pc/bsnnnnnnnnnnnnnnnnnn/index.html';
            }
        }
    </script>
</body>
</html>
