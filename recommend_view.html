<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>추천 클래스 | B-Square</title>
    <link rel="stylesheet" href="style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="/mobile_renew.css?v=20260405_01" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="bsq_server.js?v=20260402_01"></script>
    <style>
        .recommend-container {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .recommend-container { grid-template-columns: 1fr; }
            .sidebar-categories { display: none; }
        }

        .sidebar-categories h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .sidebar-categories ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-categories li a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s;
        }

        .sidebar-categories li a:hover,
        .sidebar-categories li a.active {
            color: var(--accent-color);
            font-weight: 700;
        }

        .recommend-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }
    </style>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>
<body class="recommend-page">
    <main class="main-content">
        <div class="recommend-container">
            <aside class="sidebar-categories">
                <h3>카테고리</h3>
                <ul id="categoryList">
                    <li><a href="#" class="active" data-cat="all">전체보기</a></li>
                    <li><a href="#" data-cat="디자인">디자인</a></li>
                    <li><a href="#" data-cat="생산성">생산성</a></li>
                    <li><a href="#" data-cat="스포츠">스포츠</a></li>
                    <li><a href="#" data-cat="디지털드로잉">디지털 드로잉</a></li>
                    <li><a href="#" data-cat="성공마인드">성공 마인드</a></li>
                    <li><a href="#" data-cat="음악">음악</a></li>
                    <li><a href="#" data-cat="베이킹">베이킹</a></li>
                    <li><a href="#" data-cat="사진">사진</a></li>
                    <li><a href="#" data-cat="영상">영상</a></li>
                    <li><a href="#" data-cat="공예">공예</a></li>
                </ul>
            </aside>
            <section class="recommend-content">
                <header class="recommend-header">
                    <h2 id="folderTitle">추천 클래스</h2>
                </header>
                <div class="card-grid" id="folderClassGrid">
                    <div class="empty-state" style="grid-column:1/-1; text-align:center; padding:4rem; color:#888;">
                        추천 클래스를 불러오는 중입니다...
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="header.js?v=20260402_01"></script>
    <script src="recommend_view.js?v=20260331_02"></script>
    <script src="dev_mode.js?v=20260331_02"></script>
</body>
</html>
