<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 | B-Square</title>
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style.css">
    <link rel="stylesheet" href="community.css">

    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="logo">
                <a href="../bsnnnnnnnnnnnnnnnnnn/index.html"><span class="logo-icon">💠</span> 클래스</a>
            </h1>

            <nav class="main-nav">
                <ul>
                    <li><a href="../create_class/create_class.html">등록</a></li>
                    <li><a href="#">공지사항</a></li>
                    <li><a href="#">문의</a></li>
                    <li><a href="community.html" class="nav-active">커뮤니티</a></li>
                </ul>
            </nav>

            <div class="header-utils">
                <div class="search-bar">
                    <input type="text" placeholder="검색어를 입력하세요">
                    <button type="button">🔍</button>
                </div>

                <div class="user-menu" id="userMenu" style="display: flex; gap: 10px; align-items: center;">
                </div>
            </div>
        </div>
    </header>

    <main class="comm-container">
        <!-- 왼쪽: 채팅 목록 사이드바 -->
        <aside class="comm-sidebar" id="commSidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">💬 채팅</h2>
                <button class="btn-new-chat" id="btnNewChat" title="새 대화">✏️</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="chatSearchInput" placeholder="대화 검색...">
            </div>
            <div class="sidebar-tabs">
                <button class="stab active" data-filter="all">전체</button>
                <button class="stab" data-filter="dm">1:1</button>
                <button class="stab" data-filter="class">클래스</button>
            </div>
            <div class="chat-room-list" id="chatRoomList">
                <!-- chat_list.js에서 동적 생성 -->
                <div class="chat-list-empty">
                    <span>💭</span>
                    <p>채팅이 없습니다</p>
                </div>
            </div>
        </aside>

        <!-- 가운데: 메시지 영역 -->
        <section class="comm-main" id="commMain">
            <!-- 채팅방 미선택 상태 -->
            <div class="no-chat-selected" id="noChatSelected">
                <div class="no-chat-inner">
                    <span class="no-chat-icon">💬</span>
                    <h3>B-Square 커뮤니티</h3>
                    <p>대화를 선택하거나 새 대화를 시작하세요</p>
                </div>
            </div>

            <!-- 채팅방 선택됨 -->
            <div class="chat-active-area" id="chatActiveArea" style="display:none;">
                <div class="chat-top-header" id="chatTopHeader">
                    <button class="btn-back-mobile" id="btnBackMobile">←</button>
                    <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
                    <div class="chat-header-info">
                        <span class="chat-header-name" id="chatHeaderName">채팅방</span>
                        <span class="chat-header-status" id="chatHeaderStatus">오프라인</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="btn-header-action" id="btnChatSearch" title="검색">🔍</button>
                        <button class="btn-header-action" id="btnChatInfo" title="정보">ℹ️</button>
                    </div>
                </div>

                <div class="chat-messages-container" id="chatMessagesContainer">
                    <!-- 메시지들이 여기에 렌더링됩니다 -->
                </div>

                <!-- 답장 미리보기 -->
                <div class="reply-preview" id="replyPreview" style="display:none;">
                    <div class="reply-preview-content">
                        <span class="reply-label">답장</span>
                        <span class="reply-text" id="replyText"></span>
                    </div>
                    <button class="btn-reply-cancel" id="btnReplyCancel">✕</button>
                </div>

                <!-- 파일 드롭 오버레이 -->
                <div class="file-drop-overlay" id="fileDropOverlay">
                    <div class="file-drop-inner">
                        <span>📎</span>
                        <p>파일을 여기에 드롭하세요</p>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-tools-row">
                        <button class="btn-tool" id="btnEmoji" title="이모지">😀</button>
                        <button class="btn-tool" id="btnAttach" title="파일 첨부">📎</button>
                        <input type="file" id="fileInput" multiple hidden>
                    </div>
                    <div class="input-main-row">
                        <textarea id="msgInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                        <button class="btn-send" id="btnSend">
                            <span>전송</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 오른쪽: 유저 검색 / 프로필 패널 -->
        <aside class="comm-info-panel" id="commInfoPanel" style="display:none;">
            <div class="info-panel-header">
                <h3 id="infoPanelTitle">프로필</h3>
                <button class="btn-close-panel" id="btnClosePanel">✕</button>
            </div>
            <div class="info-panel-body" id="infoPanelBody">
                <!-- 동적 콘텐츠 -->
            </div>
        </aside>

        <!-- 새 대화 모달 -->
        <div class="new-chat-modal" id="newChatModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>새 대화 시작</h3>
                    <button class="btn-close-modal" id="btnCloseModal">✕</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="userSearchInput" placeholder="사용자 이름으로 검색...">
                    <div class="user-search-results" id="userSearchResults"></div>
                </div>
            </div>
        </div>

        <!-- 이모지 피커 -->
        <div class="emoji-picker" id="emojiPicker" style="display:none;">
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="sync_bridge.js"></script>
    <script src="dm_private.js"></script>
    <script src="chat_list.js"></script>
    <script src="chat_ui.js"></script>
    <script src="community.js"></script>
    <script src="../dev_mode.js"></script>
</body>

</html>
