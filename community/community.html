<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 | B-Square</title>
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_pc.css" media="(min-width: 769px)">
    <link rel="stylesheet" href="community.css">
    <link rel="stylesheet" href="../class_view/view_chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- SDKs -->
    <script src="../bsq_server.js"></script>
</head>

<body>
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입 -->

    <main class="comm-container">
        <!-- 왼쪽 레일: 네비게이션 미니 사이드바 -->
        <nav class="comm-nav-rail" id="commNavRail">
            <div class="rail-top">
                <button class="btn-hamburger" id="btnHamburger" title="메뉴"><i class="fa-solid fa-bars"></i></button>
            </div>

            <div class="rail-tabs" id="sidebarTabs">
                <button class="stab active" data-filter="all" title="전체 대화">
                    <span class="icon"><i class="fa-solid fa-comments"></i></span>
                </button>
                <button class="stab" data-filter="dm" title="1:1 채팅">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                </button>
                <button class="stab" data-filter="class" title="클래스">
                    <span class="icon"><i class="fa-solid fa-graduation-cap"></i></span>
                </button>
                <button class="stab" data-filter="group" title="그룹">
                    <span class="icon"><i class="fa-solid fa-users-rectangle"></i></span>
                </button>
            </div>

            <!-- 사용자 폴더 탭 (동적 생성) -->
            <div class="rail-folders" id="folderTabs" style="display:none;"></div>
        </nav>

        <!-- 햄버거 메뉴 드롭다운 -->
        <div class="hamburger-menu" id="hamburgerMenu" style="display:none;">
            <div class="hm-item" id="btnNewChat"><i class="fa-solid fa-pen-to-square"></i> 새 대화 시작</div>
            <div class="hm-item" id="hmGroupChat"><i class="fa-solid fa-users-rectangle"></i> 단체 대화방 만들기</div>
            <div class="hm-item" id="hmContacts"><i class="fa-solid fa-address-book"></i> 연락처</div>
            <div class="hm-item" id="hmClassList"><i class="fa-solid fa-graduation-cap"></i> 클래스 목록</div>
            <div class="hm-item" id="hmBillingInfo"><i class="fa-solid fa-credit-card"></i> 결제 정보</div>
            <div class="hm-item" id="hmSettings"><i class="fa-solid fa-gear"></i> 설정</div>
        </div>

        <!-- 왼쪽: 채팅 목록 사이드바 -->
        <aside class="comm-sidebar" id="commSidebar">
            <div class="sidebar-header">
                <div class="sidebar-search">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none;"></i>
                    <input type="text" id="chatSearchInput" placeholder="검색" style="padding-left:38px;">
                </div>
            </div>

            <div class="chat-room-list" id="chatRoomList">
                <div class="chat-list-empty">
                    <i class="fa-regular fa-comments" style="font-size:2.5rem;color:#555;"></i>
                    <p>채팅이 없습니다</p>
                </div>
            </div>
        </aside>

        <!-- 가운데: 메시지 영역 -->
        <section class="comm-main" id="commMain">
            <!-- 채팅방 미선택 -->
            <div class="no-chat-selected" id="noChatSelected">
                <div class="no-chat-inner">
                    <i class="fa-regular fa-comment-dots" style="font-size:4rem;color:#555;margin-bottom:16px;"></i>
                    <h3>B-Square 커뮤니티</h3>
                    <p>대화를 선택하거나 새 대화를 시작하세요</p>
                </div>
            </div>

            <!-- 채팅방 활성 -->
            <div class="chat-active-area" id="chatActiveArea" style="display:none;">
                <div class="chat-top-header" id="chatTopHeader">
                    <button class="btn-back-mobile" id="btnBackMobile"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
                    <div class="chat-header-info">
                        <span class="chat-header-name" id="chatHeaderName">채팅방</span>
                        <span class="chat-header-status" id="chatHeaderStatus">오프라인</span>
                    </div>
                    <!-- 클래스 채팅용 바로가기 -->
                    <a href="#" id="btnGoToClass" class="btn-go-class" style="display:none; margin-left:10px; padding:4px 12px; background:rgba(255,255,255,0.1); border-radius:12px; font-size:0.75rem; text-decoration:none; color:var(--text-color); border:1px solid var(--border-color); white-space:nowrap;">
                        <i class="fa-solid fa-house"></i> 클래스 보러가기
                    </a>
                    
                    <div class="chat-header-actions" style="margin-left:auto;">
                        <button class="btn-header-icon" id="btnChatSearch" title="메시지 검색"><i class="fa-solid fa-magnifying-glass"></i></button>
                        <button class="btn-header-icon" id="btnThemeToggle" title="테마 전환"><i id="themeIcon" class="fas fa-moon"></i></button>
                        <button class="btn-header-icon" id="btnChatInfo" title="정보"><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                </div>

                <!-- 메시지 내 검색바 -->
                <div class="chat-search-bar" id="chatSearchBar" style="display:none;">
                    <input type="text" id="msgSearchInput" placeholder="메시지에서 검색...">
                    <span id="msgSearchCount" class="search-count"></span>
                    <button id="msgSearchClose" class="btn-search-close"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <!-- Pinned Message Bar -->
                <div id="pinnedMsgBar" class="pinned-msg-bar" style="display:none;">
                    <i class="fa-solid fa-thumbtack pin-icon"></i>
                    <div id="pinnedMsgContent" class="pinned-msg-content"><b>고정된 메시지</b> 로딩 중...</div>
                    <i class="fa-solid fa-bars-staggered"></i>
                </div>

                <div class="chat-messages-container" id="chatMessagesContainer"></div>

                <!-- 하단으로 스크롤 버튼 -->
                <button id="btnScrollBottom" class="btn-scroll-bottom" title="최신 메시지로 이동">
                    <i class="fa-solid fa-chevron-down"></i>
                    <span class="badge" id="scrollBadge" style="display:none;">0</span>
                </button>

                <!-- 답장 미리보기 -->
                <div class="reply-preview" id="replyPreview" style="display:none;">
                    <div class="reply-preview-content">
                        <i class="fa-solid fa-reply" style="color:var(--accent-color);margin-right:8px;"></i>
                        <span class="reply-text" id="replyText"></span>
                    </div>
                    <button class="btn-reply-cancel" id="btnReplyCancel"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <!-- 파일 드롭 오버레이 -->
                <div class="file-drop-overlay" id="fileDropOverlay">
                    <div class="file-drop-inner">
                        <i class="fa-solid fa-paperclip" style="font-size:3rem;color:var(--accent-color);"></i>
                        <p>파일을 여기에 드롭하세요</p>
                    </div>
                </div>

                <!-- 입력 UI (Premium Style) -->
                <div id="chatInputArea" class="chat-input-area">
                    <div class="input-pill-wrapper">
                        <button class="btn-input-icon-pill" id="btnAttach" title="파일 첨부"><i class="fa-solid fa-paperclip"></i></button>
                        <button class="btn-input-icon-pill" id="btnGathering" title="클래스 모집 카드 보내기" style="display:none;"><i class="fa-solid fa-calendar-check"></i></button>
                        <input type="file" id="fileInput" multiple hidden>
                        <textarea id="msgInput" placeholder="메시지 작성..." rows="1" spellcheck="false"></textarea>
                        <button class="btn-input-icon-pill" id="btnEmoji" title="이모지"><i class="fa-regular fa-face-smile-wink"></i></button>
                    </div>
                    <button class="btn-send-pill" id="btnSend" title="메시지 전송">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 오른쪽: 정보 패널 -->
        <aside class="comm-info-panel" id="commInfoPanel">
            <div class="info-panel-header">
                <h3 id="infoPanelTitle">프로필</h3>
                <button class="btn-close-panel" id="btnClosePanel"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="info-panel-body" id="infoPanelBody"></div>
        </aside>

        <!-- 새 대화 모달 -->
        <div class="new-chat-modal" id="newChatModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-pen-to-square"></i> 새 대화 시작</h3>
                    <button class="btn-close-modal" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="userSearchInput" placeholder="이름 또는 이메일로 검색...">
                    <div class="user-search-results" id="userSearchResults"></div>
                </div>
            </div>
        </div>

        <!-- 단체 채팅 만들기 모달 -->
        <div class="new-chat-modal" id="groupChatModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-users-rectangle"></i> 단체 채팅 만들기</h3>
                    <button class="btn-close-modal" id="btnCloseGroupModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="groupNameInput" placeholder="그룹 이름" style="margin-bottom:8px;">
                    <input type="text" id="groupSearchInput" placeholder="멤버 추가 (이름 검색)">
                    <div class="selected-members" id="selectedMembers"></div>
                    <div class="user-search-results" id="groupSearchResults"></div>
                    <button class="btn-create-group" id="btnCreateGroup">그룹 만들기</button>
                </div>
            </div>
        </div>

        <!-- 모집 카드 만들기 모달 -->
        <div class="new-chat-modal" id="gatheringModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-calendar-check"></i> 클래스 모집 카드 보내기</h3>
                    <button class="btn-close-modal" id="btnCloseGatheringModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body" style="display:flex; flex-direction:column; gap:10px;">
                    <input type="text" id="gatherTitle" placeholder="모집 제목 (예: 5월 첫 모임)" style="padding:10px; border-radius:8px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:white;" required>
                    <input type="number" id="gatherMin" placeholder="최소 인원 (예: 2)" style="padding:10px; border-radius:8px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:white;" required>
                    <input type="number" id="gatherMax" placeholder="최대 정원 (예: 10)" style="padding:10px; border-radius:8px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:white;" required>
                    <button class="btn-submit" id="btnSendGatheringSubmit" style="margin-top:10px;">모집 카드 전송</button>
                </div>
            </div>
        </div>

        <!-- 폴더 관리 모달 -->
        <div class="new-chat-modal" id="folderModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-folder-open"></i> 폴더 관리</h3>
                    <button class="btn-close-modal" id="btnCloseFolderModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <div class="folder-list" id="folderList"></div>
                    <div class="folder-create-row">
                        <input type="text" id="newFolderInput" placeholder="새 폴더 이름">
                        <button class="btn-create-folder" id="btnCreateFolder"><i class="fa-solid fa-plus"></i> 추가</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 채팅방 컨텍스트 메뉴 (우클릭/롱프레스) -->
        <div class="room-context-menu" id="roomContextMenu" style="display:none;">
            <div class="ctx-item" data-action="open-new"><i class="fa-regular fa-window-maximize"></i> 새창에서 열기</div>
            <div class="ctx-item" data-action="pin"><i class="fa-solid fa-thumbtack"></i> 고정</div>
            <div class="ctx-item" data-action="mute"><i class="fa-solid fa-bell-slash"></i> 알림 끄기</div>
            <div class="ctx-item" data-action="mark-read"><i class="fa-solid fa-eye"></i> 읽음으로 표시</div>
            <div class="ctx-item" data-action="add-folder"><i class="fa-solid fa-folder-plus"></i> 폴더에 추가</div>
            <div class="ctx-item" data-action="clear-chat"><i class="fa-solid fa-broom"></i> 대화 내용 비우기</div>
            <div class="ctx-item danger" data-action="delete-chat"><i class="fa-solid fa-trash-can"></i> 대화 삭제</div>
        </div>

        <!-- 이모지 피커 -->
        <div class="emoji-picker" id="emojiPicker" style="display:none;">
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <!-- 연락처 모달 -->
        <div class="new-chat-modal" id="contactModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-address-book"></i> 연락처</h3>
                    <button class="btn-close-modal" id="btnCloseContactModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="contactSearchInput" placeholder="연락처 추가 (이름 검색)">
                    <div class="contact-list" id="contactList"></div>
                    <div class="user-search-results" id="contactSearchResults"></div>
                </div>
            </div>
        </div>
    </main>


    <!-- Scripts: header.js(초기화) → dev_mode → 채팅 모듈 → 컨트롤러 순서 중요 -->
    <script src="../bsnnnnnnnnnnnnnnnnnn/header.js"></script>
    <script src="../kakao_quick.js"></script>
    <script src="../dev_mode.js"></script>
    <script src="sync_bridge.js"></script>
    <script src="dm_private.js"></script>
    <script src="chat_list.js"></script>
    <script src="chat_ui.js"></script>
    <script src="community.js"></script>
</body>

</html>
