<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>메시지 팝업 | B-Square</title>
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="../class_view/view_chat.css?v=20260331_02">
    <link rel="stylesheet" href="community_refined.css?v=20260402_02">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../bsq_server.js?v=20260402_01"></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_03">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>
<body data-layout="popup">
    <main class="message-popup-shell">
        <header class="popup-topbar">
            <div class="popup-topbar-title">
                <strong id="popupTitle">메시지 팝업</strong>
                <span id="popupSubtitle">대화를 빠르게 확인하고 답장할 수 있습니다</span>
            </div>
            <div class="popup-topbar-actions">
                <button class="btn-popup-top" id="btnPopupOpenMain" aria-label="메인 화면에서 보기"><i class="fa-regular fa-window-restore"></i> 메인에서 보기</button>
                <button class="btn-popup-top" id="btnPopupClose" aria-label="팝업 닫기"><i class="fa-solid fa-xmark"></i> 닫기</button>
            </div>
        </header>

        <section class="comm-main popup-main" id="commMain">
            <div class="no-chat-selected" id="noChatSelected">
                <div class="no-chat-inner">
                    <i class="fa-regular fa-comment-dots"></i>
                    <h3>메시지 팝업</h3>
                    <p>열려 있는 대화를 선택하면 메시지 창만 깔끔하게 표시됩니다.</p>
                </div>
            </div>

            <div class="chat-active-area" id="chatActiveArea" style="display:none;">
                <div class="chat-top-header" id="chatTopHeader">
                    <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
                    <div class="chat-header-info">
                        <span class="chat-header-name" id="chatHeaderName">채팅방</span>
                        <span class="chat-header-status" id="chatHeaderStatus">오프라인</span>
                    </div>
                    <a href="#" id="btnGoToClass" class="btn-go-class" style="display:none;" aria-label="클래스 상세로 이동"><i class="fa-solid fa-house"></i> 클래스 보기</a>
                    <div class="chat-header-actions">
                        <button class="btn-header-icon" id="btnChatSearch" title="검색" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
                        <button class="btn-header-icon" id="btnChatInfo" title="정보" aria-label="채팅 정보"><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                </div>

                <div class="chat-search-bar" id="chatSearchBar" style="display:none;">
                    <input type="text" id="msgSearchInput" placeholder="메시지에서 검색" aria-label="메시지 검색">
                    <span id="msgSearchCount" class="search-count"></span>
                    <button id="msgSearchClose" class="btn-search-close" aria-label="검색 닫기"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div id="pinnedMsgBar" class="pinned-msg-bar" style="display:none;">
                    <i class="fa-solid fa-thumbtack pin-icon"></i>
                    <div id="pinnedMsgContent" class="pinned-msg-content"><b>고정 메시지</b> 불러오는 중...</div>
                    <i class="fa-solid fa-bars-staggered"></i>
                </div>

                <div class="chat-messages-container" id="chatMessagesContainer"></div>

                <button id="btnScrollBottom" class="btn-scroll-bottom" title="최신 메시지로 이동">
                    <i class="fa-solid fa-chevron-down"></i>
                    <span class="badge" id="scrollBadge" style="display:none;">0</span>
                </button>

                <div class="reply-preview" id="replyPreview" style="display:none;">
                    <div class="reply-preview-content">
                        <i class="fa-solid fa-reply"></i>
                        <span class="reply-text" id="replyText"></span>
                    </div>
                    <button class="btn-reply-cancel" id="btnReplyCancel"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="file-drop-overlay" id="fileDropOverlay">
                    <div class="file-drop-inner">
                        <i class="fa-solid fa-paperclip"></i>
                        <p>파일을 이곳으로 끌어다 놓으세요.</p>
                    </div>
                </div>

                <div id="chatInputArea" class="chat-input-area">
                    <div class="input-pill-wrapper">
                        <button class="btn-input-icon-pill" id="btnAttach" title="파일 첨부" aria-label="파일 첨부"><i class="fa-solid fa-paperclip"></i></button>
                        <button class="btn-input-icon-pill" id="btnGathering" title="클래스 모집 카드" aria-label="모임 카드 만들기" style="display:none;"><i class="fa-solid fa-calendar-check"></i></button>
                        <input type="file" id="fileInput" multiple hidden>
                        <textarea id="msgInput" placeholder="메시지를 입력하세요..." rows="1" spellcheck="false" aria-label="메시지 입력"></textarea>
                        <button class="btn-input-icon-pill" id="btnEmoji" title="이모지" aria-label="이모지"><i class="fa-regular fa-face-smile-wink"></i></button>
                    </div>
                    <button class="btn-send-pill" id="btnSend" title="메시지 전송" aria-label="메시지 전송">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

        <aside class="comm-info-panel" id="commInfoPanel">
            <div class="info-panel-header">
                <h3 id="infoPanelTitle">프로필</h3>
                <button class="btn-close-panel" id="btnClosePanel" aria-label="정보 패널 닫기"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="info-panel-body" id="infoPanelBody"></div>
        </aside>

        <div class="new-chat-modal" id="gatheringModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-calendar-check"></i> 클래스 모임 카드 보내기</h3>
                    <button class="btn-close-modal" id="btnCloseGatheringModal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="gatherTitle" placeholder="모임 제목" style="margin-bottom:8px;">
                    <input type="text" id="gatherTime" placeholder="시간 / 일정" style="margin-bottom:8px;">
                    <input type="text" id="gatherPlace" placeholder="장소" style="margin-bottom:8px;">
                    <input type="number" id="gatherMin" placeholder="최소 인원" style="margin-bottom:8px;">
                    <input type="number" id="gatherMax" placeholder="최대 인원" style="margin-bottom:8px;">
                    <button class="btn-submit" id="btnSendGatheringSubmit">모임 카드 전송</button>
                </div>
            </div>
        </div>

        <div class="emoji-picker" id="emojiPicker" style="display:none;">
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>
    </main>

    <script src="../kakao_quick.js?v=20260402_01"></script>
    <script src="../dev_mode.js?v=20260331_02"></script>
    <script src="community_shared_v2.js?v=20260331_02"></script>
    <script src="sync_bridge.js?v=20260401_03"></script>
    <script src="dm_private.js?v=20260401_03"></script>
    <script src="chat_ui.js?v=20260401_03"></script>
    <script src="message_popup_v2.js?v=20260402_01"></script>
</body>
</html>
