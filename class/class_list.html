<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>B-Square | 클래스 탐색</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="class_list.css?v=20260401_08">
    <script src="../bsq_server.js?v=20260402_01" defer></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="class-list-page">
    <main class="class-list-main">
        <div class="section-inner class-list-shell">
            <section class="class-explorer-hero" aria-label="클래스 탐색">
                <div class="class-list-banner-card bottom-banner-section">
                    <div class="banner-inner home-bottom-banner-inner class-list-banner-inner">
                        <div class="home-bottom-banner-track class-list-banner-track" id="classListBannerTrack"></div>
                        <div class="home-bottom-banner-overlay class-list-banner-overlay">
                            <span class="banner-eyebrow">Class Explorer</span>
                            <h1>원하는 클래스를 더 빠르게 찾으세요</h1>
                            <p>카테고리, 검색, 정렬을 한 화면에 담아 원하는 클래스를 더 빠르게 찾을 수 있도록 정리했습니다.</p>
                            <div class="banner-actions class-list-banner-actions">
                                <a class="banner-link" href="../community/community.html">커뮤니티 둘러보기</a>
                                <a class="banner-link subtle" href="../index.html">홈으로 이동</a>
                            </div>
                        </div>
                        <div class="home-banner-controls home-bottom-banner-controls class-list-banner-controls"
                            aria-label="클래스 탐색 배너 제어">
                            <button type="button" class="banner-nav banner-nav-prev" id="classListBannerPrev" aria-label="이전 배너">←</button>
                            <div class="home-banner-dots" id="classListBannerDots" aria-label="배너 페이지"></div>
                            <button type="button" class="banner-nav banner-nav-next" id="classListBannerNext" aria-label="다음 배너">→</button>
                        </div>
                    </div>
                </div>

                <nav class="class-category-shell" id="categoryFilter" aria-label="클래스 카테고리">
                    <div class="class-category-panel-head">
                        <div>
                            <span class="banner-eyebrow">Categories</span>
                            <h2>카테고리</h2>
                        </div>
                        <p>원하는 분야를 빠르게 골라보세요.</p>
                    </div>
                    <div class="class-category-grid" aria-live="polite"></div>
                </nav>
            </section>

            <section class="class-lists-section class-page-overrides">
                <div class="class-grid-header">
                    <div class="header-copy">
                        <h3 class="group-title">전체 클래스 목록</h3>
                        <p class="group-subtitle">카테고리, 검색, 정렬로 원하는 클래스를 빠르게 찾을 수 있습니다.</p>
                    </div>
                    <div class="list-controls">
                        <div class="search-filter">
                            <input type="text" id="classSearchInput" placeholder="클래스 강사 검색" class="class-search-input">
                        </div>
                        <select id="sortSelect" class="sort-select">
                            <option value="newest">최신순</option>
                            <option value="popular">인기순</option>
                            <option value="price-low">가격 낮은순</option>
                            <option value="price-high">가격 높은순</option>
                        </select>
                        <span id="totalClassCount" class="total-count">총 0개</span>
                    </div>
                </div>
                <div id="classListNotice" class="class-list-notice" aria-live="polite"></div>
                <div class="card-grid" id="allClassGrid">
                    <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 4rem; color:#888;">
                        데이터를 불러오는 중입니다...
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="class_list.js?v=20260401_03" defer></script>
    <script src="../header.js?v=20260402_01" defer></script>
    <script src="../dev_mode.js?v=20260331_02" defer></script>
</body>

</html>
