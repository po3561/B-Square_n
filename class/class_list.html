<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>B-Square | 클래스 목록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="/mobile_renew.css?v=20260405_01" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <script src="../bsq_server.js?v=20260402_01" defer></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260421_02">
    <link rel="stylesheet" href="class_list.css?v=20260421_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="class-list-page">
    <main class="class-list-main">
        <div class="section-inner class-list-shell class-list-app">
            <section class="class-explorer-hero" aria-label="클래스 탐색">
                <div class="class-list-banner-card">
                    <div class="class-list-banner-inner">
                        <div class="class-list-banner-track" id="classListBannerTrack"></div>
                        <div class="class-list-banner-overlay">
                            <span class="banner-eyebrow">클래스 탐색</span>
                            <h1>클래스를 더 빠르게 찾아요</h1>
                            <p>배너, 카테고리, 검색을 한 줄로 압축했습니다.</p>
                            <div class="class-list-hero-stats" aria-label="목록 요약">
                                <div class="class-list-stat">
                                    <span>클래스</span>
                                    <strong id="classListStatLoaded">0</strong>
                                </div>
                                <div class="class-list-stat">
                                    <span>카테고리</span>
                                    <strong id="classListStatCategories">0</strong>
                                </div>
                                <div class="class-list-stat">
                                    <span>정렬</span>
                                    <strong id="classListStatSort">최신순</strong>
                                </div>
                            </div>
                        </div>
                        <div class="class-list-banner-actions">
                            <a class="banner-link" href="#classListControls">필터</a>
                            <a class="banner-link subtle" href="#allClassGrid">목록</a>
                        </div>
                    </div>
                    <div class="home-banner-controls class-list-banner-controls" aria-label="배너 제어">
                        <button type="button" class="banner-nav banner-nav-prev" id="classListBannerPrev" aria-label="이전 배너">&lt;</button>
                        <div class="home-banner-dots" id="classListBannerDots" aria-label="배너 페이지"></div>
                        <button type="button" class="banner-nav banner-nav-next" id="classListBannerNext" aria-label="다음 배너">&gt;</button>
                    </div>
                </div>

                <section id="categoryFilter" class="class-category-shell" aria-label="카테고리 필터"></section>
            </section>

            <section class="class-lists-section class-page-overrides">
                <div class="class-grid-header" id="classListControls">
                    <div class="header-copy">
                        <h2 class="group-title" id="classListSectionTitle">전체 클래스</h2>
                        <p class="group-subtitle" id="classListSectionCopy">검색과 정렬로 빠르게 좁혀보세요.</p>
                    </div>
                    <div class="list-controls">
                        <div class="search-filter">
                            <input type="search" id="classSearchInput" class="class-search-input" placeholder="제목, 강사, 키워드" autocomplete="off" aria-label="클래스 검색">
                        </div>
                        <select id="sortSelect" class="sort-select" aria-label="정렬 기준">
                            <option value="newest">최신순</option>
                            <option value="popular">인기순</option>
                            <option value="price-low">가격 낮은순</option>
                            <option value="price-high">가격 높은순</option>
                        </select>
                        <span id="totalClassCount" class="total-count">0</span>
                    </div>
                </div>

                <div id="classListNotice" class="class-list-notice" aria-live="polite"></div>
                <div class="card-grid large-grid" id="allClassGrid" aria-live="polite" aria-busy="false"></div>
                <div id="classListSentinel" class="class-list-sentinel" aria-hidden="true"></div>
            </section>

            <section class="recommendation-surface" id="recommendSection" aria-label="추천 클래스" hidden>
                <div class="recommend-columns" id="recommendFolderGrid"></div>
            </section>
        </div>
    </main>

    <script src="class_list.js?v=20260421_01" defer></script>
    <script src="../header.js?v=20260421_03" defer></script>
    <script src="../dev_mode.js?v=20260331_02" defer></script>
</body>

</html>
