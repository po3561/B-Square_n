<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 모음 | B-Square</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_pc.css">
    <link rel="stylesheet" href="class_list.css">

    <!-- SDKs -->
    <script src="../bsq_server.js"></script>
</head>

<body>
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입 -->

    <main class="class-list-main">
        <div class="section-inner">
            <div class="index-layout">
                <!-- 좌측 사이드바 퀵메뉴 -->
                <aside class="sidebar-nav">
                    <nav class="category-sidebar" id="categoryFilter">
                        <h3 class="sidebar-title">클래스 카테고리</h3>
                        <ul>
                            <li class="active"><a href="#" data-cat="all"><span class="icon">🌐</span>전체</a></li>
                            <li><a href="#" data-cat="디자인"><span class="icon">💻</span>디자인</a></li>
                            <li><a href="#" data-cat="생산성"><span class="icon">📈</span>생산성</a></li>
                            <li><a href="#" data-cat="스포츠"><span class="icon">⚽</span>스포츠</a></li>
                            <li><a href="#" data-cat="디지털 드로잉"><span class="icon">🎨</span>디지털 드로잉</a></li>
                            <li><a href="#" data-cat="성공 마인드"><span class="icon">💡</span>성공 마인드</a></li>
                            <li><a href="#" data-cat="음악"><span class="icon">🎵</span>음악</a></li>
                            <li><a href="#" data-cat="베이킹"><span class="icon">🥐</span>베이킹</a></li>
                            <li><a href="#" data-cat="사진"><span class="icon">📸</span>사진</a></li>
                            <li><a href="#" data-cat="영상"><span class="icon">🎬</span>영상</a></li>
                            <li><a href="#" data-cat="공예"><span class="icon">🧶</span>공예</a></li>
                        </ul>
                    </nav>
                </aside>

                <!-- 메인 콘텐츠 영역 -->
                <div class="content-area">
                    <section class="class-lists-section class-page-overrides">
                        <div class="class-grid-header">
                            <h3 class="group-title">전체 클래스 목록</h3>
                            <div class="list-controls">
                                <div class="search-filter">
                                    <input type="text" id="classSearchInput" placeholder="클래스 검색..." class="class-search-input">
                                </div>
                                <select id="sortSelect" class="sort-select">
                                    <option value="newest">최신순</option>
                                    <option value="popular">인기순</option>
                                    <option value="price-low">가격 낮은순</option>
                                    <option value="price-high">가격 높은순</option>
                                </select>
                                <span id="totalClassCount" class="total-count">총 0개</span>
                            </div>
                        </div>
                        <div class="card-grid" id="allClassGrid">
                            <!-- JS에서 동적 렌더링 -->
                            <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 4rem; color:#888;">
                                데이터를 불러오는 중입니다...</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="class_list.js"></script>
    <script src="../bsnnnnnnnnnnnnnnnnnn/header.js"></script>
    <script src="../dev_mode.js"></script>
</body>

</html>
