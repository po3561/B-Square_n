<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>B-Square | 홈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="mobile_renew.css?v=20260405_01" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css?v=20260406_01" media="(min-width: 769px)">
    <link rel="stylesheet" href="home_page.css?v=20260408_01">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="bsq_server.js?v=20260402_01" defer></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260410_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="home-page">
    <main class="main-content home-main">
        <section class="home-mobile-shell mobile-only" id="homeMobileShell" aria-label="B-Square 모바일 홈"></section>

        <section class="home-hero-section">
            <div class="home-shell home-hero-shell">
                <article class="home-intro-card">
                    <p class="home-eyebrow">B-Square 추천</p>
                    <h1 class="home-hero-title">흐름을 해치지 않는 방식으로 클래스를 찾으세요.</h1>
                    <p class="home-hero-copy">
                        운영자 설정 배너, 추천 묶음, 전체 클래스 목록을 한 흐름으로 정리해 모바일에서도 빠르게 읽히도록 맞췄습니다.
                    </p>
                    <div class="home-hero-actions">
                        <a class="home-cta" href="class/class_list.html">전체 클래스 보기</a>
                        <a class="home-cta subtle" href="community/community.html">커뮤니티 열기</a>
                    </div>
                    <div class="home-hero-stats" aria-label="홈 통계">
                        <article class="home-stat-card">
                            <span class="home-stat-label">클래스</span>
                            <strong id="homeClassTotal">0</strong>
                        </article>
                        <article class="home-stat-card">
                            <span class="home-stat-label">14일 이내 신규</span>
                            <strong id="homeFreshCount">0</strong>
                        </article>
                    </div>
                </article>

                <article class="main-ad-banner home-main-banner">
                    <div class="home-banner-stage" id="homeMainBannerStage" aria-label="메인 배너">
                        <div class="home-banner-track" id="homeMainBannerTrack"></div>
                        <div class="home-banner-controls" aria-label="메인 배너 제어">
                            <button type="button" class="banner-nav banner-nav-prev" id="homeMainBannerPrev"
                                aria-label="이전 배너">&lt;</button>
                            <button type="button" class="banner-nav banner-nav-next" id="homeMainBannerNext"
                                aria-label="다음 배너">&gt;</button>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <section class="home-curated-section">
            <div class="home-shell">
                <div class="curated-sections-dark">
                    <article class="class-group popular-classes home-surface" id="popularSection">
                        <div class="home-section-head">
                            <div>
                                <p class="home-eyebrow">인기</p>
                                <h3 class="group-title" id="popularGroupTitle">인기 클래스</h3>
                            </div>
                            <a class="home-inline-link" href="class/class_list.html?sort=popular">순위 보기</a>
                        </div>
                        <div class="card-grid home-card-grid" id="popularClassGrid">
                            <p class="empty-state">클래스를 불러오는 중입니다...</p>
                        </div>
                    </article>

                    <article class="class-group recommended-classes home-surface" id="recommendSection">
                        <div class="home-section-head">
                            <div>
                                <p class="home-eyebrow">추천 클래스</p>
                                <h3 class="group-title" id="recommendGroupTitle">추천 클래스</h3>
                            </div>
                        </div>
                        <div class="recommend-columns" id="dynamicRecommendContainer"></div>
                    </article>
                </div>
            </div>
        </section>

        <section class="home-list-section">
            <div class="home-shell">
                <article class="class-group all-classes home-surface">
                    <div class="home-section-head">
                        <div>
                            <p class="home-eyebrow">전체</p>
                            <h3 class="group-title">전체 클래스</h3>
                        </div>
                        <a class="home-inline-link" href="class/class_list.html">전체 목록 열기</a>
                    </div>
                    <div class="card-grid large-grid home-card-grid" id="allClassGrid"></div>
                </article>
            </div>
        </section>

        <section class="bottom-banner-section">
            <div class="home-shell">
                <div class="banner-inner home-bottom-banner-inner">
                    <div class="home-bottom-banner-track" id="homeBottomBannerTrack"></div>
                    <div class="home-banner-controls home-bottom-banner-controls" aria-label="하단 배너 제어">
                        <button type="button" class="banner-nav banner-nav-prev" id="homeBottomBannerPrev"
                            aria-label="이전 배너">&lt;</button>
                        <button type="button" class="banner-nav banner-nav-next" id="homeBottomBannerNext"
                            aria-label="다음 배너">&gt;</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="header.js?v=20260411_03" defer></script>
    <script src="main.js?v=20260410_01" defer></script>
    <script src="dev_mode.js?v=20260331_02" defer></script>
</body>

</html>
