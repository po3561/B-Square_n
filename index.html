<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Square</title>
    <style>
        body { background: #111; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loading { font-size: 1.2rem; color: #6e8efb; }
    </style>
</head>
<body>
    <div class="loading">잠시만 기다려주세요...</div>
    <script>
        // 즉시 메인 페이지로 이동
        // 로컬/상용 여부와 상관없이 bsnnnnnnnnnnnnnnnnnn 폴더가 실질적인 진입점입니다.
        const path = window.location.pathname;
        if (path === '/' || path === '/index.html') {
            window.location.href = 'bsnnnnnnnnnnnnnnnnnn/index.html';
        } else {
            // 만약 /terms_privacy.html 등으로 들어온 경우 subfolder 내의 해당 파일로 리다이렉트
            // path가 '/'로 시작하므로 앞에 bsn...만 붙여줍니다.
            window.location.href = 'bsnnnnnnnnnnnnnnnnnn' + path;
        }
    </script>
</body>
</html>
