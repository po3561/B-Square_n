<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>B-Square | 클래스 탐색</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* HOME PAGE
           - 헤더 아래 메인 배너
           - 배너 아래 카테고리 메뉴
           - 클래스 목록 / 하단 배너
           - 모바일 대응 오버라이드
        */
        body.home-page {
            background:
                radial-gradient(circle at 12% 0%, rgba(120, 149, 255, 0.16), transparent 28%),
                radial-gradient(circle at 88% 12%, rgba(93, 225, 198, 0.12), transparent 24%),
                linear-gradient(180deg, #05070b 0%, #070a10 40%, #05070b 100%);
        }

        body.home-page .main-content {
            display: flex;
            flex-direction: column;
            gap: clamp(1.1rem, 2.2vw, 2rem);
            padding-bottom: 1.5rem;
        }


        body.home-page .hero-inner {
            width: min(calc(100vw - 0.75rem), 1880px);
            max-width: none;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: stretch;
            padding: 0 0.35rem;
        }

        /* 메인 배너 / 카테고리 / 하단 배너 공통 유리 질감 */
        body.home-page .main-ad-banner.home-main-banner,
        body.home-page .home-category-panel,
        body.home-page .bottom-banner-section .banner-inner {
            background: linear-gradient(180deg, rgba(18, 22, 31, 0.96), rgba(10, 12, 18, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        /* 메인 배너: 실제 이미지가 들어가는 스테이지 */
        body.home-page .main-ad-banner.home-main-banner {
            border-radius: 30px;
            padding: clamp(0.48rem, 0.8vw, 0.7rem);
            overflow: hidden;
            position: relative;
            min-height: auto;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        body.home-page .main-ad-banner.home-main-banner::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(94, 140, 255, 0.22), transparent 32%),
                radial-gradient(circle at bottom left, rgba(93, 225, 198, 0.12), transparent 34%);
            pointer-events: none;
        }

        body.home-page .home-banner-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 5;
            min-height: 500px;
            border-radius: 28px;
            overflow: hidden;
            background: #090c12;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.home-page .home-banner-stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 24%),
                linear-gradient(180deg, transparent 55%, rgba(4, 6, 10, 0.22) 100%);
            pointer-events: none;
            z-index: 1;
        }

        body.home-page .home-banner-stage::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: clamp(120px, 16vw, 220px);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.82));
            pointer-events: none;
            z-index: 2;
        }

        body.home-page .home-banner-track {
            position: absolute;
            inset: 0;
        }

        body.home-page .home-banner-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.015);
            transition: opacity 640ms ease, transform 760ms ease;
            will-change: opacity, transform;
        }

        body.home-page .home-banner-slide.is-active {
            opacity: 1;
            transform: scale(1);
            z-index: 1;
        }

        body.home-page .home-banner-slide a,
        body.home-page .home-banner-slide div {
            display: block;
            width: 100%;
            height: 100%;
        }

        body.home-page .home-banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            background: #0a0d12;
        }

        body.home-page .home-banner-empty {
            display: grid;
            place-items: center;
            padding: 1.5rem;
            text-align: center;
            color: rgba(236, 242, 255, 0.75);
            font-weight: 700;
            letter-spacing: -0.03em;
            background:
                radial-gradient(circle at top left, rgba(142, 165, 255, 0.16), transparent 28%),
                radial-gradient(circle at bottom right, rgba(93, 225, 198, 0.12), transparent 30%);
        }

        body.home-page .hero-eyebrow,
        body.home-page .home-category-panel .hero-eyebrow,
        body.home-page .banner-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            width: fit-content;
            padding: 0.42rem 0.78rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d9e6ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        body.home-page .banner-link:focus-visible,
        body.home-page .home-category-item:focus-visible,
        body.home-page .class-card-link:focus-visible {
            outline: 2px solid rgba(142, 165, 255, 0.95);
            outline-offset: 3px;
        }

        /* 카테고리 패널: 배너 아래 아이콘 메뉴 */
        body.home-page .home-category-panel {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            border-radius: 30px;
            padding: clamp(1rem, 1.8vw, 1.3rem);
            min-height: 0;
        }

        body.home-page .home-category-panel h2 {
            margin: 0;
            font-size: clamp(1.2rem, 2.4vw, 1.45rem);
            line-height: 1.15;
            letter-spacing: -0.04em;
            word-break: keep-all;
        }

        body.home-page .home-category-panel p {
            margin: 0;
            color: rgba(236, 242, 255, 0.7);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        /* JS가 카테고리 카드를 주입하는 래퍼 */
        body.home-page .home-category-shell {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        body.home-page .home-category-grid {
            display: grid;
            gap: 0.55rem;
            align-content: start;
        }

        body.home-page .home-category-grid-primary {
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        body.home-page .home-category-grid-extra {
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        /* 카테고리 카드 */
        body.home-page .home-category-item {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.4rem;
            min-height: 100px;
            padding: 0.68rem 0.42rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #eef4ff;
            text-align: center;
        }

        body.home-page .home-category-item:hover,
        body.home-page .home-category-item.is-active {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(142, 165, 255, 0.3);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.16);
        }

        body.home-page .home-category-icon {
            width: clamp(36px, 4vw, 44px);
            height: clamp(36px, 4vw, 44px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.home-page .home-category-name,
        body.home-page .home-category-label {
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.25;
            word-break: keep-all;
            text-align: center;
        }

        body.home-page .home-category-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.9rem;
            padding: 0.16rem 0.42rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.68rem;
            font-weight: 700;
        }

        /* 더보기 / 접기 */
        body.home-page .home-category-toggle-row {
            display: flex;
            justify-content: center;
            padding-top: 0.1rem;
        }

        body.home-page .home-category-toggle {
            width: clamp(120px, 16vw, 160px);
            min-height: 92px;
            padding: 0.82rem 0.95rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #eef4ff;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        body.home-page .home-category-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        body.home-page .home-category-extra[hidden] {
            display: none !important;
        }

        /* 하단 배너: 푸터 바로 위 CTA */
        body.home-page .bottom-banner-section {
            margin-top: 1rem;
            padding: 0;
        }

        body.home-page .bottom-banner-section .banner-inner.home-bottom-banner-inner {
            position: relative;
            min-height: clamp(160px, 16vw, 220px);
            padding: clamp(1rem, 2vw, 1.35rem);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) auto;
            gap: 1rem;
            align-items: center;
        }

        body.home-page .home-bottom-banner-track {
            position: absolute;
            inset: 0;
        }

        body.home-page .home-bottom-banner-track .home-banner-slide img {
            object-fit: cover;
        }

        body.home-page .home-bottom-banner-overlay {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            max-width: 55ch;
        }

        body.home-page .home-bottom-banner-overlay h2 {
            margin: 0;
            font-size: clamp(1.2rem, 2vw, 1.6rem);
            line-height: 1.2;
            letter-spacing: -0.04em;
            color: #fff;
        }

        body.home-page .home-bottom-banner-overlay p {
            margin: 0;
            color: rgba(236, 242, 255, 0.72);
            line-height: 1.65;
            font-size: 0.95rem;
        }

        body.home-page .banner-actions {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            justify-self: end;
            align-self: end;
        }

        /* 배너 자동넘김 / 재생 / 간격 컨트롤 */
        body.home-page .home-banner-controls {
            position: absolute;
            right: 1rem;
            top: 1rem;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 0.32rem;
            padding: 0.3rem 0.34rem;
            border-radius: 999px;
            background: rgba(7, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        body.home-page .home-banner-controls-main {
            top: 1rem;
            right: auto;
            left: 1rem;
            bottom: auto;
            z-index: 4;
        }

        body.home-page .home-banner-controls .banner-nav {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        body.home-page .home-banner-controls .banner-nav-toggle,
        body.home-page .home-banner-controls .banner-nav-interval {
            width: auto;
            min-width: 38px;
            padding: 0 0.6rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        body.home-page .home-banner-counter {
            min-width: 4rem;
            padding: 0 0.05rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(240, 244, 255, 0.82);
            text-align: center;
            white-space: nowrap;
        }

        body.home-page .home-banner-dots {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        body.home-page .home-banner-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            border: 0;
            background: rgba(255, 255, 255, 0.32);
        }

        body.home-page .home-banner-dot.is-active {
            width: 18px;
            background: linear-gradient(135deg, #8ea5ff, #67d9c2);
        }

        body.home-page .home-category-toggle {
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 112px;
        }

        /* 전체 클래스 목록 / 추천 영역 */
        body.home-page .class-lists-section {
            padding: 0;
        }

        body.home-page .section-inner {
            max-width: min(1440px, calc(100vw - 2rem));
            padding: 0 1rem;
            display: grid;
            gap: clamp(1.4rem, 2.8vw, 2.2rem);
        }

        body.home-page .class-group {
            display: grid;
            gap: 0.9rem;
        }

        body.home-page .group-title {
            margin: 0;
            font-size: clamp(1.2rem, 2vw, 1.7rem);
            letter-spacing: -0.04em;
        }

        body.home-page .curated-sections-dark {
            display: grid;
            gap: 1.1rem;
        }

        body.home-page .curated-sections-dark.is-empty,
        body.home-page .curated-sections-dark[hidden] {
            display: none !important;
        }

        body.home-page .card-grid,
        body.home-page .recommend-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 0.9rem;
        }

        body.home-page .card-grid.large-grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        body.home-page .class-card {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-radius: 22px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(18, 22, 31, 0.96), rgba(10, 12, 18, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        body.home-page .class-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
            border-color: rgba(142, 165, 255, 0.28);
        }

        body.home-page .class-card-link {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 0;
            color: inherit;
            min-height: 100%;
        }

        body.home-page .card-thumbnail {
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(110, 142, 251, 0.18), rgba(93, 225, 198, 0.12));
        }

        body.home-page .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        body.home-page .card-thumbnail::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 58%;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.42));
            pointer-events: none;
        }

        body.home-page .btn-bookmark {
            position: absolute;
            top: 0.82rem;
            right: 0.82rem;
            z-index: 2;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(12, 15, 21, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            backdrop-filter: blur(14px);
        }

        body.home-page .card-info {
            display: grid;
            gap: 0.55rem;
            padding: 0 1rem 1rem;
        }

        body.home-page .card-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            font-size: 0.76rem;
            color: rgba(236, 242, 255, 0.72);
        }

        body.home-page .card-category,
        body.home-page .card-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 0;
        }

        body.home-page .card-chip {
            max-width: 50%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            justify-content: flex-end;
        }

        body.home-page .card-badges {
            position: absolute;
            left: 0.9rem;
            bottom: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            z-index: 1;
        }

        body.home-page .badge-coupon,
        body.home-page .badge-discount {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0.28rem 0.62rem;
            border-radius: 999px;
            background: rgba(9, 12, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eef4ff;
            font-size: 0.76rem;
            font-weight: 700;
            backdrop-filter: blur(12px);
        }

        body.home-page .title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.35;
            letter-spacing: -0.03em;
            color: #f7f9ff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        body.home-page .card-summary {
            margin: 0;
            color: rgba(236, 242, 255, 0.66);
            font-size: 0.88rem;
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        body.home-page .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem 0.8rem;
            color: rgba(236, 242, 255, 0.66);
            font-size: 0.8rem;
        }

        body.home-page .price-info {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.85rem;
            padding-top: 0.25rem;
        }

        body.home-page .price {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
        }

        body.home-page .bottom-banner-section {
            padding: 0 0 1rem;
        }

        body.home-page .banner-inner {
            max-width: min(1440px, calc(100vw - 2rem));
            margin: 0 auto;
            padding: 1.05rem 1.15rem;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        body.home-page .banner-copy {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: min(520px, 100%);
        }

        body.home-page .banner-copy h2 {
            margin: 0;
            font-size: 1.12rem;
            line-height: 1.3;
            word-break: keep-all;
        }

        body.home-page .banner-copy p:last-child {
            margin: 0;
            color: rgba(236, 242, 255, 0.7);
            line-height: 1.6;
            font-size: 0.92rem;
        }

        body.home-page .banner-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        body.home-page .banner-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0.68rem 0.95rem;
            border-radius: 14px;
            background: linear-gradient(135deg, #8ea5ff, #67d9c2);
            color: #06111c;
            font-weight: 700;
        }

        body.home-page .banner-link.subtle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #eef4ff;
        }

        @media (max-width: 1024px) {
            body.home-page .hero-inner {
                grid-template-columns: 1fr;
            }

            body.home-page .home-banner-overlay {
                grid-template-columns: 1fr;
            }

            body.home-page .home-banner-stage {
                min-height: 460px;
            }

            body.home-page .home-hero-title {
                max-width: 15ch;
            }

            body.home-page .class-card-link {
                gap: 0.8rem;
            }
        }

        @media (max-width: 768px) {

            body.home-page .hero-inner,
            body.home-page .section-inner,
            body.home-page .banner-inner {
                max-width: 100%;
                padding-left: 0.9rem;
                padding-right: 0.9rem;
            }

            body.home-page .main-content {
                padding-bottom: 6.5rem;
            }

            body.home-page .main-ad-banner.home-main-banner,
            body.home-page .home-category-panel,
            body.home-page .banner-inner {
                border-radius: 24px;
            }

            body.home-page .main-ad-banner.home-main-banner {
                min-height: 0;
            }

            body.home-page .home-category-panel {
                min-height: 0;
            }

            body.home-page .home-banner-overlay {
                grid-template-columns: 1fr;
            }

            body.home-page .home-banner-stage {
                min-height: 280px;
            }

            body.home-page .home-hero-copy {
                padding: 0.9rem 0.9rem 0.85rem;
            }

            body.home-page .home-hero-title {
                max-width: 14ch;
                font-size: clamp(1.45rem, 6vw, 2.1rem);
            }
