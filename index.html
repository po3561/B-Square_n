<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>B-Square | 클래스 탐색</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="mobile_renew.css?v=20260405_01" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="home_page.css?v=20260403_01">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 중앙 서버 모듈 (D1 API 모드) -->
    <script src="bsq_server.js?v=20260402_01" defer></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_03">

    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="home-page">
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입합니다 -->

    <main class="main-content">
        <!-- 홈 상단: 배경형 메인 배너 + 카테고리 메뉴 -->
        <section class="hero-section">
            <div class="hero-inner">
                <!-- 메인 배너: 이미지 / 자동넘김 / 최소 제어 -->
                <article class="main-ad-banner home-main-banner">
                    <div class="home-banner-stage" id="homeMainBannerStage" aria-label="메인 배너">
                        <div class="home-banner-track" id="homeMainBannerTrack"></div>
                        <div class="home-banner-controls home-banner-controls-main" aria-label="메인 배너 조작">
                            <button type="button" class="banner-nav banner-nav-prev" id="homeMainBannerPrev"
                                aria-label="이전 메인 배너">‹</button>
                            <button type="button" class="banner-nav banner-nav-toggle" id="homeMainBannerPlay"
                                aria-label="자동 넘김 일시정지" aria-pressed="true">❚❚</button>
                            <span class="home-banner-counter" id="homeMainBannerCounter" aria-live="polite">1 / 1</span>
                            <button type="button" class="banner-nav banner-nav-interval" id="homeMainBannerInterval"
                                aria-label="자동 넘김 간격">6s</button>
                            <button type="button" class="banner-nav banner-nav-next" id="homeMainBannerNext"
                                aria-label="다음 메인 배너">›</button>
                        </div>
                    </div>
                </article>

                <!-- 카테고리 패널: 11개 먼저 노출하고 나머지는 더보기 -->
                <aside class="home-category-panel">

                    <!-- JS가 카테고리 카드들을 렌더링 -->
                    <nav class="category-grid" aria-label="메인 카테고리"></nav>
                </aside>
            </div>
        </section>

        <!-- 클래스 추천 / 전체 목록 영역 -->
        <section class="class-lists-section">
            <div class="section-inner">
                <!-- 큐레이션 영역 -->
                <div class="curated-sections-dark" hidden>
                    <article class="class-group popular-classes" id="popularSection" style="display:none;">
                        <h3 class="group-title" id="popularGroupTitle">지금 인기 있는</h3>
                        <div class="card-grid" id="popularClassGrid">
                            <p class="empty-state">인기 클래스를 불러오는 중...</p>
                        </div>
                    </article>

                    <article class="class-group recommended-classes" id="recommendSection" style="display:none;">
                        <h3 class="group-title" id="recommendGroupTitle">추천 클래스</h3>
                        <div class="recommend-columns" id="dynamicRecommendContainer">
                            <!-- JS에서 동적으로 생성됨 -->
                        </div>
                    </article>
                </div>

                <!-- 전체 클래스 목록 -->
                <article class="class-group all-classes">
                    <h3 class="group-title">전체 클래스 살펴보기</h3>
                    <div class="card-grid large-grid" id="allClassGrid">
                        <!-- JS에서 렌더링 -->
                    </div>
                </article>
            </div>
        </section>

        <!-- 하단 배너: 푸터 직전 CTA -->
        <section class="bottom-banner-section">
            <div class="banner-inner home-bottom-banner-inner">
                <div class="home-bottom-banner-track" id="homeBottomBannerTrack"></div>
                <div class="home-bottom-banner-overlay">
                    <span class="banner-eyebrow">Explore more</span>
                    <h2>커뮤니티에서 질문하고, 클래스에서 바로 시작하세요.</h2>
                    <p>수강 흐름과 실시간 소통을 끊지 않고 이어가도록 설계했습니다.</p>
                </div>
                <div class="banner-actions">
                    <a class="banner-link" href="community/community.html">커뮤니티 둘러보기</a>
                    <a class="banner-link subtle" href="class/class_list.html">전체 클래스 보기</a>
                </div>
                <div class="home-banner-controls home-bottom-banner-controls" aria-label="하단 배너 조작">
                    <button type="button" class="banner-nav banner-nav-prev" id="homeBottomBannerPrev"
                        aria-label="이전 하단 배너">‹</button>
                    <div class="home-banner-dots" id="homeBottomBannerDots" aria-label="하단 배너 페이지"></div>
                    <button type="button" class="banner-nav banner-nav-next" id="homeBottomBannerNext"
                        aria-label="다음 하단 배너">›</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 공통 셸 / 홈 데이터 / 개발 모드 -->
    <script src="header.js?v=20260402_02" defer></script>
    <script src="main.js?v=20260402_02" defer></script>
    <script src="dev_mode.js?v=20260331_02" defer></script>
</body>

</html>
