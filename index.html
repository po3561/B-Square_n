<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Square</title>
    <link rel="stylesheet" href="style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="style_pc.css" media="(min-width: 769px)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 중앙 서버 모듈 (D1 API 모드) -->
    <script src="bsq_server.js?v=20260323_05"></script>
</head>

<body>
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입합니다 -->

    <main class="main-content">
        <section class="hero-section">
            <div class="hero-inner">
                <article class="main-ad-banner">
                    <div class="ad-content">
                        <h2>광고</h2>
                    </div>
                </article>
                <nav class="category-grid" aria-label="메인 카테고리"></nav>
            </div>
        </section>

        <section class="class-lists-section">
            <div class="section-inner">
                <!-- 큐레이션 영역 -->
                <div class="curated-sections-dark">
                    <article class="class-group popular-classes" id="popularSection" style="display:none;">
                        <h3 class="group-title" id="popularGroupTitle">지금 인기 있는</h3>
                        <div class="card-grid" id="popularClassGrid">
                            <p class="empty-state">인기 클래스를 불러오는 중...</p>
                        </div>
                    </article>

                    <article class="class-group recommended-classes" id="recommendSection" style="display:none;">
                        <h3 class="group-title" id="recommendGroupTitle">추천 클래스</h3>
                        <div class="recommend-columns" id="dynamicRecommendContainer">
                            <!-- JS에서 동적으로 생성됨 -->
                        </div>
                    </article>
                </div>

                <!-- 전체 클래스 목록 -->
                <article class="class-group all-classes">
                    <h3 class="group-title">전체 클래스 살펴보기</h3>
                    <div class="card-grid large-grid" id="allClassGrid">
                        <!-- JS에서 렌더링 -->
                    </div>
                </article>
            </div>
        </section>

        <section class="bottom-banner-section">
            <div class="banner-inner">
                <button class="btn-prev">⬅️</button>
                <div class="banner-content">
                    <p>배너</p>
                </div>
                <button class="btn-next">➡️</button>
            </div>
        </section>
    </main>

    <script src="header.js?v=20260324_03"></script>
    <script src="main.js?v=20260324_04"></script>
    <script src="dev_mode.js"></script>
</body>

</html>
