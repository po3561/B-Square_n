<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>비밀번호 재설정 | B-Square</title>
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="/mobile_renew.css?v=20260405_01" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="auth.css?v=20260331_02">
    <script src="../bsq_server.js?v=20260402_01"></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header" style="text-align:center; margin-bottom:2rem;">
            <h1 class="logo">
                <a href="../index.html" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
                    <span class="logo-icon">◆</span>
                    <span>B-Square</span>
                </a>
            </h1>
            <p class="auth-subtitle" style="color:var(--text-secondary); margin-top:0.5rem;">새 비밀번호를 입력해 주세요.</p>
        </div>

        <form id="resetPasswordForm" class="auth-form active">
            <div class="input-group">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" minlength="8" required style="border-radius:12px; padding:14px; border:1px solid var(--border-color); width:100%; box-sizing:border-box; margin-top:8px;">
            </div>
            <div class="input-group" style="margin-top:14px;">
                <label for="confirmPassword">비밀번호 확인</label>
                <input type="password" id="confirmPassword" minlength="8" required style="border-radius:12px; padding:14px; border:1px solid var(--border-color); width:100%; box-sizing:border-box; margin-top:8px;">
            </div>
            <button type="submit" class="btn-submit" style="width:100%; padding:16px; border-radius:16px; background:linear-gradient(135deg, #6e8efb, #a777e3); color:white; border:none; font-weight:bold; font-size:1rem; margin-top:20px; box-shadow:0 4px 12px rgba(110,142,251,0.3); cursor:pointer;">비밀번호 변경하기</button>
        </form>
    </div>

    <script src="update_password.js?v=20260331_02"></script>
</body>
</html>
