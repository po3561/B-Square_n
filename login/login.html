<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>로그인 | B-Square</title>
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="auth.css?v=20260331_02">
    <script src="../bsq_server.js?v=20260331_02"></script>
    <link rel="stylesheet" href="/theme_overrides.css?v=20260401_04">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="auth-body">
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입 -->

    <main class="auth-main">
        <div class="auth-container">

            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label for="loginUsername">로그인 아이디 (이메일)</label>
                    <input type="text" id="loginUsername" placeholder="이메일 또는 아이디를 입력해주세요" required>
                </div>

                <div class="input-group">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호를 입력해주세요" required>
                </div>

                <div class="login-utils">
                    <label class="checkbox-label" for="chkSaveId">
                        <input type="checkbox" id="chkSaveId"> 아이디 저장
                    </label>
                    <div class="find-links">
                        <a href="find_account.html">아이디 찾기</a> |
                        <a href="find_account.html#reset">비밀번호 찾기</a>
                    </div>
                </div>

                <button type="submit" class="btn-submit">로그인</button>

                <div class="auth-link">
                    계정이 없으신가요? <a href="signup.html">회원가입하기</a>
                </div>
            </form>
        </div>
    </main>


    <script src="auth_1.js?v=20260331_02"></script>
    <script src="../header.js?v=20260401_05"></script>
    <script src="../dev_mode.js?v=20260331_02"></script>
</body>

</html>
