<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 클래스 플랫폼</title>
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style_pc.css" media="(min-width: 769px)">
    <link rel="stylesheet" href="auth.css">
    <script src="../bsq_server.js?v=FIX_REF_ERROR_01"></script>
</head>

<body class="auth-body">
    <!-- header.js가 헤더/푸터/Drawer/BottomNav를 동적 삽입 -->

    <main class="auth-main">
        <div class="auth-container">

            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label for="loginUsername">로그인 아이디 (이메일)</label>
                    <input type="text" id="loginUsername" placeholder="이메일 또는 아이디를 입력해주세요" required>
                </div>

                <div class="input-group">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="비밀번호를 입력해주세요" required>
                </div>

                <div class="login-utils">
                    <label class="checkbox-label" for="chkSaveId">
                        <input type="checkbox" id="chkSaveId"> 아이디 저장
                    </label>
                    <div class="find-links">
                        <a href="find_account.html">아이디 찾기</a> |
                        <a href="find_account.html#reset">비밀번호 찾기</a>
                    </div>
                </div>

                <button type="submit" class="btn-submit">로그인</button>

                <div class="auth-link">
                    계정이 없으신가요? <a href="signup.html">회원가입하기</a>
                </div>
            </form>
        </div>
    </main>


    <script src="auth_1.js"></script>
    <script src="../bsnnnnnnnnnnnnnnnnnn/header.js"></script>
    <script src="../dev_mode.js"></script>
</body>

</html>
