<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>회원가입 | B-Square</title>
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="auth.css?v=20260402_03">
    <link rel="stylesheet" href="/theme_overrides.css?v=20260402_01">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="auth-body auth-standalone auth-signup-page">
    <main class="auth-screen">
        <section class="auth-card auth-card--signup">
            <h1 class="auth-brand">
                <a class="auth-brand-link" href="../index.html" aria-label="B-Square 홈으로 이동">
                    <span class="auth-brand-mark" aria-hidden="true">◆</span>
                    <span class="auth-brand-text">B-Square</span>
                </a>
            </h1>

            <h2 class="auth-title">회원가입</h2>
            <p class="auth-subtitle">카카오, 네이버, 구글로 본인 인증을 먼저 진행한 뒤 가입 정보를 입력하세요.</p>

            <div class="auth-banner" data-auth-banner hidden></div>

            <section class="social-auth-shell social-auth-shell--signup" id="socialAuthSignup" data-social-auth
                data-social-context="signup" data-social-return="signup.html" data-unavailable-mode="disable">
                <div class="social-auth-list" data-social-auth-list></div>
                <p class="social-auth-message" data-social-auth-message hidden></p>
                <p class="social-auth-hint">본인 인증이 끝나면 아래 가입 정보를 바로 입력할 수 있습니다.</p>
            </section>

            <section class="social-verification-card" data-signup-verification hidden>
                <p class="social-verification-card__eyebrow">본인 인증 완료</p>
                <h2 class="social-verification-card__title" data-signup-provider></h2>
                <p class="social-verification-card__summary" data-signup-summary></p>
                <dl class="social-verification-card__list">
                    <div>
                        <dt>인증 이메일</dt>
                        <dd data-signup-email></dd>
                    </div>
                    <div>
                        <dt>인증 이름</dt>
                        <dd data-signup-name></dd>
                    </div>
                </dl>
            </section>

            <form id="signupForm" class="auth-form">
                <div class="input-group">
                    <label for="signupId">아이디</label>
                    <div class="input-with-btn">
                        <input type="text" id="signupId" name="username" autocomplete="username"
                            placeholder="프로필에 표시될 아이디" required>
                        <button type="button" id="btnCheckId" class="btn-secondary">중복 확인</button>
                    </div>
                    <p id="idStatusMsg" class="status-msg"></p>
                </div>

                <div class="input-group">
                    <label for="signupEmail">이메일</label>
                    <input type="email" id="signupEmail" name="email" autocomplete="email" placeholder="example@email.com"
                        required>
                </div>

                <div class="input-group">
                    <label for="signupName">이름</label>
                    <input type="text" id="signupName" name="name" autocomplete="name" placeholder="이름을 입력해 주세요"
                        required>
                </div>

                <div class="input-group">
                    <label for="signupPhone">휴대폰 번호</label>
                    <input type="tel" id="signupPhone" name="phone" autocomplete="tel" placeholder="010-0000-0000">
                </div>

                <div class="input-group">
                    <label for="signupReferrerCode">추천인 코드 (선택)</label>
                    <select id="signupReferrerCode" name="referrer_code">
                        <option value="">추천인 코드를 선택해 주세요 (선택사항)</option>
                    </select>
                    <p id="referrerCodeStatus" class="status-msg"></p>
                </div>

                <div class="input-group">
                    <label for="signupPassword">비밀번호</label>
                    <input type="password" id="signupPassword" name="password" autocomplete="new-password"
                        placeholder="8자 이상 입력해 주세요" required>
                </div>

                <div class="input-group">
                    <label for="signupPasswordConfirm">비밀번호 확인</label>
                    <input type="password" id="signupPasswordConfirm" autocomplete="new-password"
                        placeholder="비밀번호를 다시 입력해 주세요" required>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">회원가입 완료</button>
            </form>

            <div class="auth-links auth-links--split">
                <a href="login.html">로그인으로 돌아가기</a>
                <a href="find_account.html">계정 찾기</a>
            </div>
        </section>
    </main>

    <script src="auth_api.js?v=20260401_02"></script>
    <script src="social_auth.js?v=20260402_01"></script>
    <script src="signup_page.js?v=20260402_02"></script>
</body>

</html>
