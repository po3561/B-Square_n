<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 찾기 | 클래스 플랫폼</title>
    <link rel="stylesheet" href="../bsnnnnnnnnnnnnnnnnnn/style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="logo">
                <a href="/bsnnnnnnnnnnnnnnnnnn/index.html"><span class="logo-icon">💠</span> 클래스</a>
            </h1>
            <p class="auth-subtitle">계정 정보를 찾을 수 있습니다</p>
        </div>

        <div class="step-indicator">
            <div class="step-item active" style="flex:1">아이디 찾기</div>
            <div class="step-item" style="flex:1">비밀번호 찾기</div>
        </div>

        <div class="input-group">
            <label>가입 시 등록한 이메일</label>
            <input type="email" id="findEmail" placeholder="example@email.com">
        </div>

        <button type="button" class="btn-submit">확인</button>

        <div class="auth-link">
            기억이 나셨나요? <a href="login.html">로그인 페이지로</a>
        </div>
    </div>

</body>

</html>
