<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme_bootstrap.js?v=20260331_01"></script>
    <title>계정 찾기 | B-Square</title>
    <link rel="stylesheet" href="../style_mobile.css?v=20260331_02" media="(max-width: 768px)">
    <link rel="stylesheet" href="../style_pc.css?v=20260331_02" media="(min-width: 769px)">
    <link rel="stylesheet" href="auth.css?v=20260402_03">
    <link rel="stylesheet" href="/theme_overrides.css?v=20260401_04">
    <script src="/i18n.js?v=20260331_01" defer></script>
</head>

<body class="auth-body auth-standalone auth-recovery-page">
    <main class="auth-screen">
        <section class="auth-card auth-card--recovery">
            <h1 class="auth-brand">
                <a class="auth-brand-link" href="../index.html" aria-label="B-Square 홈으로 이동">
                    <span class="auth-brand-mark" aria-hidden="true">◆</span>
                    <span class="auth-brand-text">B-Square</span>
                </a>
            </h1>

            <h2 class="auth-title">계정 찾기</h2>
            <p class="auth-subtitle">가입했던 이메일로 계정을 확인하거나, 소셜 인증으로 본인 확인을 진행하세요.</p>

            <div class="auth-banner" data-auth-banner hidden></div>

            <div class="auth-switch-row" role="tablist" aria-label="계정 찾기 방식">
                <button type="button" class="auth-switch-button is-active" data-recovery-tab="email" role="tab"
                    aria-selected="true">이메일로 찾기</button>
                <button type="button" class="auth-switch-button" data-recovery-tab="social" role="tab"
                    aria-selected="false">소셜 인증</button>
            </div>

            <section class="auth-panel is-active" data-recovery-panel="email">
                <p class="auth-muted">가입 시 등록한 이메일이 맞는지 확인하고, 안내 메일을 받아 계정 복구를 시작합니다.</p>
                <form id="findAccountForm" class="auth-form">
                    <div class="input-group">
                        <label for="findEmail">가입 이메일</label>
                        <input type="email" id="findEmail" name="email" autocomplete="email"
                            placeholder="example@email.com" required>
                    </div>

                    <button type="submit" class="btn-submit">계정 확인하기</button>
                </form>
            </section>

            <section class="auth-panel" data-recovery-panel="social" hidden>
                <section class="social-auth-shell social-auth-shell--recovery" id="socialAuthRecovery"
                    data-social-auth data-social-context="recovery" data-social-return="find_account.html#social"
                    data-unavailable-mode="disable">
                    <div class="social-auth-list" data-social-auth-list></div>
                    <p class="social-auth-message" data-social-auth-message hidden></p>
                    <p class="social-auth-hint">카카오, 네이버, 구글 계정으로 본인 확인을 진행할 수 있습니다.</p>
                </section>
            </section>

            <section class="account-summary-card" data-recovery-summary hidden>
                <p class="account-summary-card__eyebrow" data-recovery-summary-state>계정 확인 결과</p>
                <h2 class="account-summary-card__title" data-recovery-summary-title></h2>
                <p class="account-summary-card__summary" data-recovery-summary-text></p>
                <dl class="account-summary-card__list">
                    <div>
                        <dt>이메일</dt>
                        <dd data-recovery-email></dd>
                    </div>
                    <div>
                        <dt>연결된 로그인</dt>
                        <dd data-recovery-providers></dd>
                    </div>
                </dl>
                <div class="account-summary-card__actions">
                    <button type="button" class="btn-secondary" data-request-reset>비밀번호 재설정 메일 보내기</button>
                    <a class="auth-text-link" href="login.html">로그인 페이지로</a>
                </div>
            </section>

            <div class="auth-links auth-links--split">
                <a href="login.html">로그인으로 돌아가기</a>
                <a href="signup.html">회원가입하기</a>
            </div>
        </section>
    </main>

    <script src="auth_api.js?v=20260401_02"></script>
    <script src="social_auth.js?v=20260402_01"></script>
    <script src="recovery_page.js?v=20260402_02"></script>
</body>

</html>
